version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: caged_postgres
    restart: always
    environment:
      POSTGRES_USER: caged
      POSTGRES_PASSWORD: caged
      POSTGRES_DB: caged
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
